name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: |
          uv run ruff check core/ train/ distill/
          uv run ruff format --check core/ train/ distill/

      - name: Type check (mypy strict)
        run: uv run mypy core/ train/ distill/ --strict

      - name: Run unit tests
        run: uv run pytest core/tests/ -q

      - name: Check imports
        run: |
          uv run python -c "
          from core.model import GPT
          from core.data import build_datasets
          from core.tokenizer import load_tokenizer
          from core.infer import generate
          from core.evaluate import run_test
          print('All imports OK')
          "

      - name: Regenerate training data
        run: uv run python train/data/prepare_data.py

      - name: Rebuild tokenizer
        run: uv run python -m core.build_tokenizer

      - name: Quick training smoke test (50 steps)
        run: uv run python -m train.train --max_steps 50 --device cpu --no-acceptance
        timeout-minutes: 10

      - name: Run evaluation
        run: uv run python -m core.evaluate
