[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-teacher"
version = "1.0.0"
description = "A small-scale GPT model for teaching and demonstration"
authors = [
    {name = "GPT Teacher Team", email = "contact@gpt-teacher.ai"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=1.12.0",
    "tokenizers>=0.13.0",
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "gradio>=4.25.0,<4.26.0",
    "starlette<1.0.0",
    "huggingface_hub<0.25.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
    "transformers>=4.48.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.11",
    "ruff>=0.6.0",
    "types-pyyaml>=6.0.12.20260815",
]
notebook = [
    "jupyter>=1.0",
    "ipywidgets>=8.0",
]

[project.urls]
Homepage = "https://github.com/helloworldtang/GPT_teacher-3.37M-cn"
Repository = "https://github.com/helloworldtang/GPT_teacher-3.37M-cn"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "train*", "distill*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["train/notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "core.tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
